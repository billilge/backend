spring:
  application:
    name: backend

  datasource:
    url: jdbc:mysql://${DB_URL}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: BillilgeHikariCP
      maximum-pool-size: 15
      minimum-idle: 15
      connection-timeout: 3000
      validation-timeout: 2000
      idle-timeout: 600000
      max-lifetime: 1740000
      keepalive-time: 300000

  security:
    oauth2:
      client:
        registration:
          # 구글 로그인 추가
          google:
            client-id: ${OAUTH2_GOOGLE_CLIENT_ID}
            client-secret: ${OAUTH2_GOOGLE_CLIENT_SECRET}
            redirect-uri: ${SWAGGER_SERVER_BASE_URL}/login/oauth2/code/google
            scope:
              - email
              - profile
  jpa:
    properties:
      hibernate:
        # show-sql 과 함께만 의미가 있고, 켜면 쿼리마다 포매팅 비용이 붙는다
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
        dialect.storage_engine: innodb
    # show-sql 은 로거를 거치지 않고 System.out 에 직접 쓴다.
    # 레벨로 끌 수도, 비동기 appender 로 돌릴 수도 없고 요청 스레드들이 출력 락에서 직렬화된다.
    # SQL 을 봐야 할 때는 아래 logging.level 을 debug 로 올린다 (로거 경로라 제어가 된다).
    show-sql: false
    hibernate:
      ddl-auto: update

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
      resolve-lazily: true


logging:
  level:
    org.hibernate.SQL: info                # debug 로 올리면 실행 SQL 출력
    org.hibernate.orm.jdbc.bind: info      # trace 로 올리면 바인딩 파라미터까지 출력


server:
  tomcat:
    threads:
      max: 100
      min-spare: 20
    accept-count: 100
    max-connections: 2000
    connection-timeout: 5000ms
  shutdown: graceful


jwt:
  secret_key: ${JWT_SECRET_KEY}
  issuer: ${JWT_ISSUER}

login:
  redirect-url: ${LOGIN_REDIRECT_URL}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET}
  base-url: ${MINIO_BASE_URL}

swagger:
  server:
    base-url: ${SWAGGER_SERVER_BASE_URL}